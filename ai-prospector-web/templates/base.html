<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Prospector 🧸</title>
<style>
:root {
--bg: #FFF9F5;
--card-bg: #FFFFFF;
--card-border: #FFE2D6;
--text-main: #4A3B32;
--text-sub: #8D7B68;
--text-muted: #BFA89B;
--pink: #FF8DA1;
--pink-light: #FFE8EC;
--lavender: #B5A2F8;
--lavender-light: #F0ECFE;
--green: #68D391;
--green-light: #E6F9EE;
--blue: #63B3ED;
--blue-light: #EBF8FF;
--coral: #FC8181;
--coral-light: #FFF5F5;
--shadow: 0 4px 12px rgba(196, 151, 130, 0.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
header { background: var(--card-bg); border-bottom: 2px solid var(--card-border); padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
.brand { font-size: 20px; font-weight: 800; color: var(--text-main); text-decoration: none; }
nav a { text-decoration: none; font-size: 14px; font-weight: 700; color: var(--text-sub); margin-left: 18px; padding: 8px 16px; border-radius: 20px; transition: all 0.2s; }
nav a:hover, nav a.active { background: var(--pink-light); color: var(--pink); }
main { max-width: 900px; margin: 24px auto; padding: 0 16px; width: 100%; flex: 1; }
.flash-box { margin-bottom: 16px; }
.flash { padding: 12px 16px; border-radius: 14px; font-size: 13px; font-weight: 600; margin-bottom: 8px; border: 1px solid transparent; }
.flash.success { background: var(--green-light); color: #22543D; border-color: #C6F6D5; }
.flash.info { background: var(--blue-light); color: #2B6CB0; border-color: #BEE3F8; }
.flash.error { background: var(--coral-light); color: #742A2A; border-color: #FED7D7; }
.card { background: var(--card-bg); border-radius: 20px; border: 1px solid var(--card-border); padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
</style>
</head>
<body>
<header>
<a href="/" class="brand">AI Prospector 🧸</a>
<nav>
<a href="/" class="{{ 'active' if request.path == '/' else '' }}">Pipeline 🌸</a>
<a href="/compliance" class="{{ 'active' if request.path == '/compliance' else '' }}">Resting Friends 🐶</a>
</nav>
</header>
<main>
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="flash-box">
{% for category, message in messages %}
<div class="flash {{ category }}">{{ message }}</div>
{% endfor %}
</div>
{% endif %}
{% endwith %}
{% block content %}{% endblock %}
</main>
</body>
</html>
